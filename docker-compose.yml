# Full SmartRail stack: application services, identity, database and observability.
#   cp .env.example .env
#   docker compose up -d --build
# Day-to-day development uses the Aspire AppHost instead; this file is the production-shaped stack.

name: smartrail

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  # ---------- data and identity ----------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smartraildb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d smartraildb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Tokens carry the public issuer; the API reaches Keycloak by its service name.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data/h2
    restart: unless-stopped

  # ---------- application ----------
  api:
    build:
      context: .
      dockerfile: src/Host/SmartRail.Api/Dockerfile
    image: smartrail/api:${TAG:-local}
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: smartrail-api
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__smartraildb: Host=postgres;Port=5432;Database=smartraildb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__keycloak: http://keycloak:8080
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      otel-collector:
        condition: service_started
    # No container healthcheck: the aspnet runtime image has no wget or curl.
    # Probe /alive from the orchestrator (Container Apps, Kubernetes) instead.
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: tools/Simulator/SmartRail.Simulator/Dockerfile
    image: smartrail/simulator:${TAG:-local}
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: smartrail-simulator
      services__api__http__0: http://api:8080
    depends_on:
      - api
    restart: unless-stopped

  catering:
    build:
      context: services/catering
    image: smartrail/catering:${TAG:-local}
    environment:
      PORT: "4000"
    ports:
      - "4000:4000"
    restart: unless-stopped

  console:
    build:
      context: apps/web
      args:
        APP: console
    image: smartrail/console:${TAG:-local}
    ports:
      - "3000:8080"
    restart: unless-stopped

  kiosk:
    build:
      context: apps/web
      args:
        APP: kiosk
    image: smartrail/kiosk:${TAG:-local}
    ports:
      - "3001:8080"
    restart: unless-stopped

  # ---------- observability ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  postgres-data:
  keycloak-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
