name: Task
description: A technical task, chore or piece of work to track
title: "task: "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to be done and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Mobile
        - Web
        - Catering
        - Infrastructure / CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
