name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SmartRail.slnx
      - run: dotnet build SmartRail.slnx --no-restore -c Release -warnaserror
      - run: dotnet test SmartRail.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build --workspace=console
      - run: npm run build --workspace=kiosk

  catering:
    name: Catering typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/catering/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present

  mobile:
    name: Mobile analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze apps/passenger apps/driver packages/core packages/design_system packages/api_client
      - run: flutter test apps/passenger
      - run: flutter test apps/driver

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, web, catering]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: src/Host/SmartRail.Api/Dockerfile
          - name: simulator
            context: .
            file: tools/Simulator/SmartRail.Simulator/Dockerfile
          - name: catering
            context: services/catering
            file: services/catering/Dockerfile
          - name: console
            context: apps/web
            file: apps/web/Dockerfile
            args: APP=console
          - name: kiosk
            context: apps/web
            file: apps/web/Dockerfile
            args: APP=kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: false
          load: true
          tags: smartrail-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartrail-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
