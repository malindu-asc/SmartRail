# SmartRail — single source of truth for schedule, progress and AI usage.
#
# Everything in docs/plan/ and PROGRESS.md is GENERATED from this file.
# Never edit those by hand. Edit here (or use the CLI) then run:  npm run build
#
# Format rules (the parser is deliberately strict and tiny):
#   - 2-space indent, no tabs
#   - every list item starts with "- id: <value>"
#   - inline arrays only for flat lists:  [a, b, c]
#   - status: todo | doing | done | blocked | deferred
#   - est/actual/saved are hours (numbers)
#   - ai.verdict: not-used | accepted | accepted-with-edits | rejected

