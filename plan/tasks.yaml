# Deferred register - things consciously cut. Keep adding here instead of silently dropping.
deferred:
  - id: X-01
    title: Ticketing fares and seat reservation
    reason: Not in the brief - SmartRail is an information platform, commerce would double the domain.
  - id: X-02
    title: Real card payments
    reason: Payment ownership assigned to the catering provider - test mode only.
  - id: X-03
    title: Knock-on delay propagation between trains
    reason: Requires a network capacity model - named as known real behaviour but out of scope.
  - id: X-04
    title: Train splitting joining and coach composition
    reason: Rare and hard - documented as a domain extension point.
  - id: X-05
    title: SMS and email notification channels
    reason: Push plus in-app covers the demonstrated journeys with no new architecture lesson.
  - id: X-06
    title: Kubernetes multi-region and autoscaling
    reason: Documented as a production path - not built.
